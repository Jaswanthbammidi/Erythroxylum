name: Astrology Bio Pipeline

on:
  workflow_dispatch:
    inputs:
      person_name:
        description: "Enter name for astrology biography"
        required: true
        default: "User"

jobs:
  run-astrology:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Astrology Script
        run: |
          echo "${{ github.event.inputs.person_name }}" | python Script.py
